name: Partner Monitor

on:
  schedule:
    # 7h UTC = 8h Paris CET (hiver) / 9h Paris CEST (été)
    - cron: "0 7 * * 1-5"
  workflow_dispatch:  # permet un déclenchement manuel depuis GitHub

permissions:
  contents: write  # needed for the keep-alive commit below

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RECIPIENT_NAME: ${{ secrets.RECIPIENT_NAME }}
        run: python monitor.py

      # GitHub disables scheduled workflows after 60 days without a commit.
      # Commit once a month (only if the repo has been quiet for 30+ days).
      - name: Keep workflow alive
        if: always()
        run: |
          last_commit=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last_commit ) / 86400 ))
          echo "Last commit: $age_days days ago"
          if [ "$age_days" -lt 30 ]; then exit 0; fi
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "chore: keep workflow alive [skip ci]"
          git push
